server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # Internal service API (WhatsApp PA ↔ API) lives on the private docker network only.
  location /api/internal/ {
    return 404;
  }

  # API + websockets go to the api container (same origin → no CORS setup needed)
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never let a public request carry the internal service key.
    proxy_set_header X-Atrium-Internal-Key "";
  }
  location /socket.io/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Single-page app: unknown paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(js|css|svg|png|jpg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
