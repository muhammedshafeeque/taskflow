# One-command local/prod stack: MongoDB + Atrium API + web app + WhatsApp PA bot.
#   cp server/.env.example server/.env   (set JWT_SECRET etc.)
#   cp PA/.env.example PA/.env           (set GROQ_API_KEY, PA_ADMIN_SECRET)
#   docker compose up -d --build
# Web: http://localhost:8080   PA admin API: http://localhost:3000
# First run: docker compose exec api node dist/scripts/create-super-admin.js
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/atrium
      PORT: "5000"
      APP_URL: ${APP_URL:-http://localhost:8080}
      PA_API_URL: http://pa:3000
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./Tasks
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  pa:
    build: ./PA
    restart: unless-stopped
    env_file: ./PA/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pa
      TASKFLOW_API_URL: http://api:5000
      PORT: "3000"
    ports:
      - "${PA_PORT:-3000}:3000"
    volumes:
      - wa-session:/app/.wwebjs_auth
    # Chromium needs a bit of shared memory.
    shm_size: "512mb"
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["pa"]

volumes:
  mongo-data:
  uploads:
  wa-session:
